# Supabase local dev - used with: npx supabase start
# Docs: https://supabase.com/docs/guides/local-development/cli/config
project_id = "rapsproject"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15
health_timeout = "2m"

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173"]
enable_signup = true
# enable_signup_confirmations = false
minimum_password_length = 6

[storage]
enabled = true

[realtime]
enabled = true
